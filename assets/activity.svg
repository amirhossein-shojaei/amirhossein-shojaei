<svg xmlns="http://www.w3.org/2000/svg" width="900" height="108" viewBox="0 0 900 108" role="img" aria-labelledby="t d" fill="none">
<title id="t">04 / GitHub activity</title>
<desc id="d">Live GitHub activity: contribution streak statistics and a contribution snake generated daily from real contribution data.</desc>
<style>.s{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
.lg{animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.09}50%{opacity:.24}}
.live{animation:live 1.8s ease-in-out infinite}@keyframes live{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<filter id="dg" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#42d6a4" flood-opacity=".9"/></filter>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a25"/><stop offset="1" stop-color="#0f1721"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop stop-color="#315678"/><stop offset="1" stop-color="#315678" stop-opacity="0"/></linearGradient>
<clipPath id="pc"><rect x="1" y="1" width="898" height="106" rx="16"/></clipPath>
</defs>
<rect x=".5" y=".5" width="899" height="107" rx="16" fill="url(#pg)" stroke="#263647"/>
<text class="m" x="40" y="50" font-size="17" font-weight="600" letter-spacing="0.6" textLength="216.0" lengthAdjust="spacingAndGlyphs"><tspan fill="#5ee6cf">04</tspan><tspan fill="#9ecbff"> / GITHUB ACTIVITY</tspan></text>
<rect x="270.0" y="44" width="590.0" height="1" fill="url(#hl)"/>
<circle class="live" cx="46" cy="80" r="4" fill="#42d6a4" filter="url(#dg)"/>
<text class="s" x="60" y="85" font-size="15" fill="#91a4b8">Live contribution data — streak stats update on every visit, and the snake regenerates daily from real commits.</text>
</svg>
