<title id="t">01 / About me</title>
<desc id="d">Full-Stack Development: Building frontend experiences and backend services for real products. Shopify Applications: Exploring embedded apps, storefront experiences, and platform integrations. Infrastructure &amp; Delivery: Working with Linux, containers, deployment, and production environments. AI-Powered Products: Integrating AI capabilities and external APIs into useful application workflows.</desc>
