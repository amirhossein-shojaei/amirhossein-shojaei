<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1042" viewBox="0 0 900 1042" role="img" aria-labelledby="t d" fill="none">
<title id="t">03 / Selected projects</title>
<desc id="d">Hobo (Shopify): A Shopify embedded application that brings AI-powered chat and customer support into the commerce experience. Hobo pairs automated AI conversations with a human handoff workflow, so routine questions are answered quickly while conversations that need a personal touch can be passed to a person. Stack: Shopify, Web Components, AI. Elixia (Pwa): A modern Progressive Web App platform focused on delivering an app-like experience directly on the web. Elixia combines the reach and accessibility of the browser with the responsiveness and polish people expect from native applications. Stack: PWA, Web Development. Personal Website (Portfolio): A personal developer website and portfolio that brings professional identity, selected work, and technical focus together in one place, giving visitors a clear picture of the person and the work behind the code. Stack: Next.js, React, Tailwind CSS.</desc>
